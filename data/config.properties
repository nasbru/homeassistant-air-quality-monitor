# MQTT
mqtt.broker = tcp://localhost:1883
mqtt.discovery_prefix = homeassistant

mqtt.bme680.clientId = bme680_publisher_1
mqtt.bme680.baseTopic = home/bme680_1
mqtt.bme680.node_id = bme680_1

mqtt.pms7003.clientId = pms7003_publisher_1
mqtt.pms7003.baseTopic = home/pms7003_1
mqtt.pms7003.node_id = pms7003_1

# BME680
# temperature (Celsius)
bme680.temperature.offset = -0.9
# humidity (%)
bme680.humidity.offset = 0
# pressure (hPa)
bme680.pressure.offset = 0
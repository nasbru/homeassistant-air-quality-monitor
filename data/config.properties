# APP
app.interval = 30

# MQTT
mqtt.broker = tcp://localhost:1883
mqtt.discovery_prefix = homeassistant

# BME680
bme680.enabled = true
# temperature (°C)
bme680.temperature.offset = -0.9
# humidity (%)
bme680.humidity.offset = 0
# pressure (hPa)
bme680.pressure.offset = 0

# PMS Sensor (e.g. PMS7003, PMS5003)
pms.enabled = true
pms.name = PMS7003
pms.device = /dev/ttyUSB0
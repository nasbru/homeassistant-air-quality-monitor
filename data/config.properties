# APP
app.interval = 30

# MQTT
mqtt.broker = tcp://localhost:1883
mqtt.discovery_prefix = homeassistant

# BME680
bme680.enabled = true
# temperature (Celsius)
bme680.temperature.offset = -0.9
# humidity (%)
bme680.humidity.offset = 0
# pressure (hPa)
bme680.pressure.offset = 0

# PMS7003
pms7003.enabled = true
pms7003.device = /dev/ttyUSB0